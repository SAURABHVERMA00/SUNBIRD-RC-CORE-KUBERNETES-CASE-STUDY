{{- if .Values.services.backend.keycloak.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  labels:
    app: keycloak
data:
  DB_VENDOR: postgres
  DB_ADDR: postgres-service
  DB_PORT: "5432"
  DB_DATABASE: registry
  KEYCLOAK_LOGO: https://svgshare.com/i/hCs.svg
  PROXY_ADDRESS_FORWARDING: "true"
  KEYCLOAK_IMPORT: /opt/jboss/keycloak/imports/realm-export.json

{{- end }}

{{- if .Values.services.backend.keycloak.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-deployment
  labels:
    app: keycloak
spec:
{{ include "sunbird-rc.deploymentReplicas" (dict "autoscaling" .Values.services.backend.keycloak.autoscaling "replicaCount" .Values.services.backend.keycloak.replicaCount) | indent 2 }}
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nc -z -w5 postgres-service 5432; do
              echo "Waiting for Postgres..."
              sleep 5
            done

      containers:
      - name: keycloak
        image: ghcr.io/sunbird-rc/sunbird-rc-keycloak:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080 # Application (ODIC)
        - containerPort: 9990 #admin
        env:
        - name: KEYCLOAK_HTTP_ENABLED
          value: "true"
        - name: KEYCLOAK_HTTP_PORT
          value: "8080"
        - name: KEYCLOAK_HOSTNAME_STRICT
          value: "false"

        {{- include "sunbird-rc.resources.heavy" (dict) | nindent 8 }}

        envFrom:
        - secretRef:
            name: keycloak-secret
        - configMapRef:
            name: keycloak-config
        volumeMounts:
        - name: realm
          mountPath: /opt/jboss/keycloak/imports
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30

      volumes:
      - name: realm
        configMap:
          name: keycloak-realm

        

{{- end }}

{{- if .Values.services.backend.keycloak.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  labels:
    app: keycloak
type: Opaque
stringData:
  DB_USER: {{ .Values.secrets.postgres.username | quote }}
  DB_PASSWORD: {{ .Values.secrets.postgres.password | quote }}
  KEYCLOAK_USER: {{ .Values.secrets.keycloak.user | quote }}
  KEYCLOAK_PASSWORD: {{ .Values.secrets.keycloak.password | quote }}
{{- end }}

{{- if .Values.services.backend.keycloak.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  labels:
    app: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak
  
  ports:
    - protocol: TCP
      name: http
      port: 8080
      targetPort: 8080  
    - protocol: TCP
      name: admin
      port: 9990
      targetPort: 9990
  
# 8080 is the Keycloak application port.
# This is the public-facing HTTP endpoint for login, token requests, and user-facing auth flows.
# 9990 is the Keycloak admin/management port.
# This is used by the Keycloak admin console and internal management APIs, not by normal application auth traffic.
{{- end }}

{{- if .Values.services.backend.identity.enabled }}
---
apiVersion: v1
