  ENABLE_AUTH: "false"
  WEB_DID_BASE_URL: http://identity-service:3332

{{- end }}

{{- if .Values.services.backend.identity.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-deployment
  labels:
    app: identity
spec:
{{ include "sunbird-rc.deploymentReplicas" (dict "autoscaling" .Values.services.backend.identity.autoscaling "replicaCount" .Values.services.backend.identity.replicaCount) | indent 2 }}
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      serviceAccountName: identity-sa
      containers:
        - name: identity
          image: ghcr.io/sunbird-rc/sunbird-rc-identity-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3332

          {{- include "sunbird-rc.resources.default" (dict) | nindent 10 }}

          envFrom:
            - configMapRef:
                name: identity-config
            - secretRef:
                name: identity-secret

          env:
            - name: PRISMA_MIGRATE
              value: "true"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: identity-secret
                  key: VAULT_TOKEN
          readinessProbe:
            httpGet:
              path: /health
              port: 3332
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3332
            initialDelaySeconds: 30
            periodSeconds: 10

          startupProbe:
            tcpSocket:
              port: 3332
            initialDelaySeconds: 60
            failureThreshold: 30
            periodSeconds: 10
{{- end }}

{{- if .Values.services.backend.identity.enabled }}
