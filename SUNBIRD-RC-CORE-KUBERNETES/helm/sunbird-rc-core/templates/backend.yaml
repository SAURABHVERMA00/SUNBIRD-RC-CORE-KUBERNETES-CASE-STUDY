{{- if .Values.services.backend.claim_ms.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claim-ms-config
  labels:
    app: claim-ms
data:
  connectionInfo_uri: "jdbc:postgresql://postgres-service:5432/registry"
  sunbirdrc_url: "http://registry-service:8081"

{{- end }}

{{- if .Values.services.backend.claim_ms.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claim-ms-deployment
  labels:
    app: claim-ms
spec:
{{ include "sunbird-rc.deploymentReplicas" (dict "autoscaling" .Values.services.backend.claim_ms.autoscaling "replicaCount" .Values.services.backend.claim_ms.replicaCount) | indent 2 }}
  selector:
    matchLabels:
      app: claim-ms
  template:
    metadata:
      labels:
        app: claim-ms
    spec:
      containers:
      - name: claim-ms
        image: ghcr.io/sunbird-rc/sunbird-rc-claim-ms:latest
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8082

        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        envFrom:
        - configMapRef:
            name: claim-ms-config
        - secretRef:
            name: claim-ms-secret

        # Docker healthcheck → Kubernetes readiness
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        # Optional but recommended
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

{{- end }}

{{- if .Values.services.backend.claim_ms.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: claim-ms-secret
  labels:
    app: claim-ms
type: Opaque
stringData:
  connectionInfo_username: {{ .Values.secrets.postgres.username | quote }}
  connectionInfo_password: {{ .Values.secrets.postgres.password | quote }}
{{- end }}

{{- if .Values.services.backend.claim_ms.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: claim-ms-service
  labels:
    app: claim-ms
spec:
  selector:
    app: claim-ms
  ports:
  - name: http
    port: 8082
    targetPort: 8082
  type: ClusterIP

{{- end }}

{{- if .Values.services.backend.encryption.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: encryption-config
data:
  SERVER_PORT: "8013"
  SERVER_SERVLET_CONTEXT_PATH: "/"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/registry"
  SPRING_FLYWAY_URL: "jdbc:postgresql://postgres-service:5432/registry"
  EGOV_MDMS_PROVIDER: "org.egov.enc.masterdata.provider.DBMasterDataProvider"
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  MANAGEMENT_ENDPOINTS_WEB_BASE_PATH: "/"

{{- end }}

{{- if .Values.services.backend.encryption.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encryption-deployment
  labels:
    app: encryption
spec:
{{ include "sunbird-rc.deploymentReplicas" (dict "autoscaling" .Values.services.backend.encryption.autoscaling "replicaCount" .Values.services.backend.encryption.replicaCount) | indent 2 }}
  selector:
    matchLabels:
      app: encryption
  template:
    metadata:
      labels:
        app: encryption
    spec:
      containers:
      - name: encryption
        image: ghcr.io/sunbird-rc/encryption-service:v2.0.0-rc1
        ports:
        - containerPort: 8013

        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 400m
            memory: 512Mi

        envFrom:
        - configMapRef:
            name: encryption-config
        - secretRef:
            name: encryption-secret

        readinessProbe:
          httpGet:
            path: /health
            port: 8013
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8013
          initialDelaySeconds: 120
          periodSeconds: 30

        startupProbe:
          httpGet:
            path: /health
            port: 8013
          failureThreshold: 60
          periodSeconds: 10

{{- end }}

{{- if .Values.services.backend.encryption.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: encryption-secret
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.password | quote }}
{{- end }}

{{- if .Values.services.backend.encryption.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: encryption-service
  labels:
    app: encryption
spec:

  selector:
    app: encryption
  ports:
    - protocol: TCP
      port: 8013
      targetPort: 8013
  
{{- end }}

