  VAULT_TOKEN: {{ .Values.secrets.identity.vaultToken | quote }}

{{- end }}

{{- if .Values.services.backend.identity.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  labels:
    app: identity
spec:
  selector:
    app: identity
  ports:
    - port: 3332
      targetPort: 3332
  type: ClusterIP

{{- end }}

{{- if .Values.services.backend.certificate_signer.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: certificate-signer-deployment
  labels:
    app: certificate-signer
spec:
{{ include "sunbird-rc.deploymentReplicas" (dict "autoscaling" .Values.services.backend.certificate_signer.autoscaling "replicaCount" .Values.services.backend.certificate_signer.replicaCount) | indent 2 }}
  selector:
    matchLabels:
      app: certificate-signer
  template:
    metadata:
      labels:
        app: certificate-signer
    spec:
      containers:
      - name: certificate-signer
        image: ghcr.io/sunbird-rc/sunbird-rc-certificate-signer:latest
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8079

        {{- include "sunbird-rc.resources.default" (dict) | nindent 8 }}

        env:
        - name: PORT
          value: "8079"
        - name: TIME_ZONE
          value: "Asia/Kolkata"

        volumeMounts:
        - name: signer-config
          mountPath: /etc/signer
          readOnly: true

        # Docker healthcheck → Kubernetes readiness
        readinessProbe:
          httpGet:
            path: /health
            port: 8079
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        # Optional but recommended
        livenessProbe:
          httpGet:
            path: /health
            port: 8079
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: signer-config
        configMap:
          name: signer-imports


# kubectl create configmap signer-imports \
#  --from-file=imports \
# --dry-run=client -o yaml > signer-imports.yaml
# run: kubectl apply -f signer-imports.yaml

{{- end }}

{{- if .Values.services.backend.certificate_signer.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: certificate-signer-service
  labels:
    app: certificate-signer
spec:
  selector:
    app: certificate-signer
  ports:
  - name: http
    port: 8079
    targetPort: 8079
  type: ClusterIP

{{- end }}

{{- if .Values.services.backend.certificate_api.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: certificate-api-deployment
  labels:
    app: certificate-api
spec:
{{ include "sunbird-rc.deploymentReplicas" (dict "autoscaling" .Values.services.backend.certificate_api.autoscaling "replicaCount" .Values.services.backend.certificate_api.replicaCount) | indent 2 }}
  selector:
    matchLabels:
      app: certificate-api
  template:
    metadata:
      labels:
        app: certificate-api
    spec:
      containers:
      - name: certificate-api
        image: ghcr.io/sunbird-rc/sunbird-rc-certificate-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8078

        {{- include "sunbird-rc.resources.default" (dict) | nindent 8 }}

        env:
        - name: PORT
          value: "8078"
          
        readinessProbe:
          httpGet:
            path: /health
            port: 8078
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 8078
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
       
{{- end }}

{{- if .Values.services.backend.certificate_api.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: certificate-api-service
  labels:
    app: certificate-api
spec:
  selector:
    app: certificate-api
  ports:
  - name: http
    port: 8078
    targetPort: 8078
  type: ClusterIP

{{- end }}

{{- if .Values.services.backend.id_gen.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: id-gen-config
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/registry"
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  AUTOCREATE_NEW_SEQ: "true"
  IDFORMAT_FROM_MDMS: "false"
  EGOV_MDMS_PROVIDER: "org.egov.id.masterdata.provider.DBMasterDataProvider"

{{- end }}

{{- if .Values.services.backend.id_gen.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: id-gen-deployment
  labels:
    app: id-gen
spec:
{{ include "sunbird-rc.deploymentReplicas" (dict "autoscaling" .Values.services.backend.id_gen.autoscaling "replicaCount" .Values.services.backend.id_gen.replicaCount) | indent 2 }}
  selector:
    matchLabels:
      app: id-gen
  template:
    metadata:
      labels:
        app: id-gen
    spec:
      containers:
      - name: id-gen
        image: ghcr.io/sunbird-rc/id-gen-service:v2.0.0-rc1
        ports:
        - containerPort: 8088

        {{- include "sunbird-rc.resources.default" (dict) | nindent 8 }}

        envFrom:
        - configMapRef:
            name: id-gen-config

        startupProbe:
          httpGet:
            path: /egov-idgen/health
            port: 8088
          failureThreshold: 60  # 5 minutes
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /egov-idgen/health
            port: 8088
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /egov-idgen/health
            port: 8088
          initialDelaySeconds: 90
          periodSeconds: 30
       
{{- end }}

{{- if .Values.services.backend.id_gen.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: id-gen-service
  labels:
    app: id-gen
spec:

  selector:
    app: id-gen
  ports:
    - protocol: TCP
      port: 8088
      targetPort: 8088
  type: ClusterIP
{{- end }}

{{- if .Values.services.backend.file_storage.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-deployment
  labels:
    app: minio
spec:
{{ include "sunbird-rc.deploymentReplicas" (dict "autoscaling" .Values.services.backend.file_storage.autoscaling "replicaCount" .Values.services.backend.file_storage.replicaCount) | indent 2 }}
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: quay.io/minio/minio
        imagePullPolicy: IfNotPresent

        # Docker command → Kubernetes args
        args:
          - server
          - --address
          - 0.0.0.0:9000
          - --console-address
          - 0.0.0.0:9001
          - /data

        ports:
        - containerPort: 9000
        - containerPort: 9001

        {{- include "sunbird-rc.resources.default" (dict "cpu" "250m" "memory" "512Mi" "cpuLimit" "500m" "memoryLimit" "1Gi") | nindent 8 }}

        envFrom:
        - secretRef:
            name: minio-secret

        volumeMounts:
        - name: data
          mountPath: /data

        # Docker healthcheck → Kubernetes readiness
        readinessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        # Optional but recommended
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minio-pvc

{{- end }}

{{- if .Values.services.backend.file_storage.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  labels:
    app: minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

{{- end }}

{{- if .Values.services.backend.file_storage.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  labels:
    app: minio  
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.secrets.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minio.rootPassword | quote }}


{{- end }}

{{- if .Values.services.backend.file_storage.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: file-storage-service
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
  type: ClusterIP

{{- end }}

