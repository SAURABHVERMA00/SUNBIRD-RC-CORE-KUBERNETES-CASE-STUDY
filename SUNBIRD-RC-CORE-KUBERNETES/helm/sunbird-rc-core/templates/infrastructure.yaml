  POSTGRES_PASSWORD: {{ .Values.secrets.postgres_db.password | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgres_db.database | quote }}

{{- end }}

{{- if .Values.services.infrastructure.db.enabled }}
---
