{{- if .Values.services.infrastructure.elastic.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  labels:
    app: elastic-search
data:
  discovery.type: single-node
  ES_JAVA_OPTS: "-Xms512m -Xmx512m"
  xpack.security.enabled: "false"


{{- end }}

{{- if .Values.services.infrastructure.elastic.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elastic-deployment
  labels:
    app: elastic-search
spec:
  serviceName: "elastic-service"
  replicas: 1
  selector:
    matchLabels:
      app: elastic-search
  template:
    metadata:
      labels:
        app: elastic-search
    spec:
      containers:
      - name: elastic-search
        image: docker.elastic.co/elasticsearch/elasticsearch:7.12.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9200
        - containerPort: 9300

        {{- include "sunbird-rc.resources.heavy" (dict "memory" "1Gi" "memoryLimit" "2Gi") | nindent 8 }}

        env:
        - name: discovery.type
          valueFrom:
            configMapKeyRef:
              name: elasticsearch-config
              key: discovery.type
        - name: ES_JAVA_OPTS
          valueFrom:
            configMapKeyRef:
              name: elasticsearch-config
              key: ES_JAVA_OPTS
        - name: xpack.security.enabled
          valueFrom:
            configMapKeyRef:
              name: elasticsearch-config
              key: xpack.security.enabled
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-secret
              key: ELASTIC_PASSWORD
        - name: BASIC_AUTH
          valueFrom:
            secretKeyRef:
              name: elasticsearch-secret
              key: BASIC_AUTH
        volumeMounts:
        - name: elasticsearch-storage
          mountPath: /usr/share/elasticsearch/data/*
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - |
              curl -f http://localhost:9200/_cluster/health \
                -H "Authorization: Basic ${BASIC_AUTH}" 
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - |
              curl -f http://localhost:9200 \
                -H "Authorization: Basic ${BASIC_AUTH}"
          failureThreshold: 30   # 30 × 10s = 5 minutes
          periodSeconds: 10

  volumeClaimTemplates:
  - metadata:
      name: elasticsearch-storage
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
{{- end }}

{{- if .Values.services.infrastructure.elastic.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-secret
  labels:
    app: elastic-search
type: Opaque
stringData:
  ELASTIC_PASSWORD: {{ .Values.secrets.elasticsearch.password | quote }}
  BASIC_AUTH: {{ .Values.secrets.elasticsearch.basicAuth | quote }}

{{- end }}

{{- if .Values.services.infrastructure.elastic.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: elastic-service
  labels:
    app: elastic-search
spec:
  selector:
    app: elastic-search
  ports:
    - protocol: TCP
      name: http
      port: 9200
      targetPort: 9200
    - protocol: TCP
      name: transport
      port: 9300
      targetPort: 9300
  type: LoadBalancer

{{- end }}

