{{- if .Values.services.infrastructure.vault.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault-deployment
spec:
  serviceName: "vault-service"
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: vault:1.13.3
          imagePullPolicy: IfNotPresent

          args:
            - "vault"
            - "server"
            - "-config=/vault/config/vault.json"
          ports:
            - containerPort: 8200

          {{- include "sunbird-rc.resources.default" (dict) | nindent 10 }}

          env:
            - name: VAULT_ADDR
              value: "http://vault-service:8200"
            - name: VAULT_API_ADDR
              value: "http://vault-service:8200"
            - name: VAULT_ADDRESS
              value: "http://vault-service:8200"
            - name: VAULT_SKIP_CHOWN
              value: "true"
          volumeMounts:
            - name: vault-config
              mountPath: /vault/config
            - name: vault-data
              mountPath: /vault/data
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          readinessProbe:
            tcpSocket:
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          startupProbe:
            tcpSocket:
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        - name: vault-config
          configMap:
            name: vault-config
  volumeClaimTemplates:
  - metadata:
      name: vault-data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi

# i just add vault.json file in config map
#kubectl create configmap vault-config \
#  --from-file=vault.json \
#  --dry-run=client -o yaml > vault-config.yaml
 # run this command to create config map file
 # kubectl apply -f vault-config.yaml

{{- end }}

{{- if .Values.services.infrastructure.vault.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  labels:
    app: vault
spec:
  clusterIP: None
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200

{{- end }}

{{- if .Values.services.infrastructure.kafka.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  labels:
    app: kafka
data:
  KAFKA_BROKER_ID: "1"
  KAFKA_ZOOKEEPER_CONNECT: "zookeeper-service:2181"

  KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092"
  KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-service:9092"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

{{- end }}

{{- if .Values.services.infrastructure.kafka.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-deployment
  labels:
    app: kafka
spec:
  serviceName: "kafka-service"
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.4.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9092

        {{- include "sunbird-rc.resources.heavy" (dict "memory" "1Gi" "memoryLimit" "2Gi") | nindent 8 }}

        volumeMounts:
        - name: kafka-storage
          mountPath: /var/lib/kafka/data
  
        envFrom:
        - configMapRef:
            name: kafka-config
      
        startupProbe:
          tcpSocket:
            port: 9092
          failureThreshold: 30
          periodSeconds: 10

        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 60
          periodSeconds: 20  
           
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 120
          periodSeconds: 30

  volumeClaimTemplates:
  - metadata:
      name: kafka-storage
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

{{- end }}

{{- if .Values.services.infrastructure.kafka.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  labels:
    app: kafka
spec:
  clusterIP: None #headless service
  selector:
    app: kafka
  
  ports:
    - protocol: TCP
      name: http
      port: 9092
      targetPort: 9092
   
{{- end }}

{{- if .Values.services.infrastructure.db.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-deployment
  labels:
    app: postgres
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:14.20-trixie
        ports:
        - containerPort: 5432

        {{- include "sunbird-rc.resources.heavy" (dict "memory" "512Mi" "memoryLimit" "1Gi") | nindent 8 }}

        volumeMounts: 
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
        
{{- end }}

