{{- if .Values.services.infrastructure.clickhouse.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse-deployment
  labels:
    app: clickhouse
spec:
  serviceName: "clickhouse-service"
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:23.4.2.11-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000  #Native client port
        - containerPort: 8123  # HTTP  health check port

        {{- include "sunbird-rc.resources.heavy" (dict "memory" "1Gi" "memoryLimit" "2Gi") | nindent 8 }}

        readinessProbe:
          httpGet:
            path: /ping
            port: 8123
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /ping
            port: 8123
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
       
{{- end }}

{{- if .Values.services.infrastructure.clickhouse.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-service
  labels:
    app: clickhouse
spec:

  selector:
    app: clickhouse
  ports:
    - protocol: TCP
      name: native
      port: 9002 #what other services will use to connect to clickhouse
      targetPort: 9000 #clickhouse native client port
    - protocol: TCP
      name: http
      port: 8123
      targetPort: 8123
  type: ClusterIP
{{- end }}

{{- if .Values.services.infrastructure.metrics.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-config
  labels:
    app: metrics
data:
  CLICK_HOUSE_URL: "clickhouse-service:9000"
  CLICKHOUSE_DATABASE: "default"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  KAFKA_METRICS_TOPIC: "events"
  REDIS_URL: "redis-service:6379"
{{- end }}

{{- if .Values.services.infrastructure.metrics.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-deployment
  labels:
    app: metrics
spec:
{{- include "sunbird-rc.deploymentReplicas" (dict "autoscaling" .Values.services.infrastructure.metrics.autoscaling "replicaCount" .Values.services.infrastructure.metrics.replicaCount) | nindent 2 }}
  selector:
    matchLabels:
      app: metrics
  template:
    metadata:
      labels:
        app: metrics
    spec:
      containers:
      - name: metrics
        image: ghcr.io/sunbird-rc/sunbird-rc-metrics
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8070

        {{- include "sunbird-rc.resources.default" (dict) | nindent 8 }}

        envFrom:
        - configMapRef:
            name: metrics-config
      
        readinessProbe:
          httpGet:
            path: /health
            port: 8070
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 8070
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
      

   

{{- end }}

{{- if .Values.services.infrastructure.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-service
  labels:
    app: metrics
spec:
  selector:
    app: metrics
  
  ports:
    - protocol: TCP
      name: http
      port: 8070
      targetPort: 8070
   
{{- end }}

{{- if .Values.services.infrastructure.redis.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-deployment
  labels:
    app: redis
spec:
  serviceName: "redis-service"
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:latest
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 6379

        {{- include "sunbird-rc.resources.default" (dict "cpu" "100m" "memory" "256Mi" "cpuLimit" "500m" "memoryLimit" "512Mi") | nindent 8 }}

        volumeMounts:
        - name: redis-storage
          mountPath: /data

        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 15
          periodSeconds: 20

  volumeClaimTemplates:
  - metadata:
      name: redis-storage
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi

# Redis in Kubernetes should be exposed via a ClusterIP Service and health-checked using TCP socket probes.
#Redis is a TCP service, not an HTTP service — so TCP socket probes are the correct he
{{- end }}

{{- if .Values.services.infrastructure.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  type: ClusterIP

{{- end }}

{{- if .Values.services.infrastructure.public_key.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-key-deployment
  labels:
    app: public-key
spec:
{{- include "sunbird-rc.deploymentReplicas" (dict "autoscaling" .Values.services.infrastructure.public_key.autoscaling "replicaCount" .Values.services.infrastructure.public_key.replicaCount) | nindent 2 }}
  selector:
    matchLabels:
      app: public-key
  template:
    metadata:
      labels:
        app: public-key
    spec:
      containers:
      - name: public-key
        image: ghcr.io/sunbird-rc/sunbird-rc-public-key-service
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 3300

        {{- include "sunbird-rc.resources.light" (dict) | nindent 8 }}

        env:
        - name: CONFIG_BASE_PATH
          value: /etc/keys
        

        volumeMounts:
        - name: key-imports
          mountPath: /etc/keys
          readOnly: true

        # Docker healthcheck equivalent
        readinessProbe:
          httpGet:
            path: /public-key-service/api/v1/health
            port: 3300
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        # Optional but recommended
        livenessProbe:
          httpGet:
            path: /public-key-service/api/v1/health
            port: 3300
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

      volumes:
      - name: key-imports
        configMap:
          name: public-key-imports


# kubectl create configmap public-key-imports \
 # --from-file=imports \
 # --dry-run=client -o yaml > public-key-imports.yaml
# run: kubectl apply -f public-key-imports.yaml

{{- end }}

{{- if .Values.services.infrastructure.public_key.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: public-key-service
  labels:
    app: public-key
spec:
  selector:
    app: public-key
  ports:
  - name: http
    port: 3300
    targetPort: 3300
  type: ClusterIP

{{- end }}

{{- if .Values.services.infrastructure.zookeeper.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper-deployment
  labels:
    app: zookeeper
spec:
  serviceName: "zookeeper-service"
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:latest
        ports:
        - containerPort: 2181

        {{- include "sunbird-rc.resources.default" (dict "cpu" "200m" "memory" "512Mi" "cpuLimit" "500m" "memoryLimit" "1Gi") | nindent 8 }}

        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"

        volumeMounts:
        - name: data
          mountPath: /var/lib/zookeeper

        readinessProbe:
          tcpSocket:
            port: 2181
          initialDelaySeconds: 10
          periodSeconds: 10

  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app: zookeeper
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
{{- end }}

{{- if .Values.services.infrastructure.zookeeper.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  labels:
    app: zookeeper
spec:
  clusterIP: None
  selector:
    app: zookeeper
  ports:
  - port: 2181
    targetPort: 2181
   

{{- end }}

